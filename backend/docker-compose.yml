# Fixed project name. Without it, Compose names the project after this folder
# ("backend"), and wouldn't find the existing container and data volume
# created when this folder was still called food-backend.
name: food-backend

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<version>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
